<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsApp Web Platform</title>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
.container { max-width: 1200px; margin: 0 auto; padding: 20px; }
header { text-align: center; padding: 30px 0; }
header h1 { font-size: 2em; color: #22c55e; }
header p { color: #94a3b8; margin-top: 5px; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
@media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
.card { background: #1e293b; border-radius: 12px; padding: 20px; border: 1px solid #334155; }
.card h2 { font-size: 1.1em; margin-bottom: 15px; color: #38bdf8; }
input, textarea, select { width: 100%; padding: 10px; margin-bottom: 10px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #e2e8f0; font-size: 14px; }
textarea { resize: vertical; min-height: 80px; font-family: monospace; }
button { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600; transition: opacity .2s; }
button:hover { opacity: .85; }
.btn-primary { background: #22c55e; color: #fff; }
.btn-danger { background: #ef4444; color: #fff; }
.btn-secondary { background: #475569; color: #fff; }
.btn-sm { padding: 6px 12px; font-size: 12px; }
.flex { display: flex; gap: 10px; flex-wrap: wrap; }
.mt-10 { margin-top: 10px; }
.mt-20 { margin-top: 20px; }
.session-card { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
.session-card .status { display: flex; align-items: center; gap: 8px; }
.status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.status-connected { background: #22c55e; }
.status-scanning { background: #eab308; }
.status-disconnected { background: #ef4444; }
.status-auth_failure { background: #ef4444; }
.status-initializing { background: #94a3b8; }
.qr-container { text-align: center; padding: 20px; }
.qr-container canvas { max-width: 200px; }
.log { background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 10px; max-height: 200px; overflow-y: auto; font-family: monospace; font-size: 12px; line-height: 1.6; }
.log .sent { color: #22c55e; }
.log .error { color: #ef4444; }
.log .no_whatsapp { color: #eab308; }
.hidden { display: none; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #334155; }
th { color: #94a3b8; font-weight: 600; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>WhatsApp Web Platform</h1>
    <p>Multi-session chatbot management</p>
  </header>

  <div class="grid">
    <div>
      <div class="card">
        <h2>Sessions</h2>
        <div class="flex">
          <input type="text" id="sessionName" placeholder="Session name..." style="flex:1">
          <button class="btn-primary" onclick="createSession()">Create</button>
        </div>
        <div id="sessionList" class="mt-20"></div>
      </div>

      <div class="card mt-20" id="qrCard">
        <h2>QR Code</h2>
        <div id="qrContainer" class="qr-container"></div>
        <div id="qrStatus" style="text-align:center;color:#94a3b8"></div>
      </div>
    </div>

    <div>
      <div class="card">
        <h2>Send Message</h2>
        <select id="sendSessionSelect"><option>Select a session first</option></select>
        <input type="text" id="sendNumber" placeholder="Phone number (e.g. 5491161819436)">
        <input type="text" id="sendName" placeholder="Contact name (optional)">
        <textarea id="sendMessage" placeholder="Message template (use {{nombre}} for name)">Buenas tardes, {{nombre}}. Queria consultar precio y stock?</textarea>
        <div class="flex">
          <button class="btn-primary" onclick="sendSingle()">Send</button>
          <button class="btn-secondary" onclick="sendBulk()">Send All Contacts</button>
        </div>
      </div>

      <div class="card mt-20">
        <h2>Import Contacts</h2>
        <div class="flex">
          <input type="text" id="importSessionSelect" placeholder="Session ID..." style="flex:1">
          <button class="btn-secondary btn-sm" onclick="fetchContacts()">Load</button>
        </div>
        <textarea id="contactsCsv" placeholder="CSV: number|name|address&#10;5491161819436|Juan Perez|Av. Siempreviva 742" rows="4"></textarea>
        <button class="btn-secondary btn-sm" onclick="importContacts()">Import CSV</button>
        <div id="contactsList" class="mt-10"></div>
      </div>

      <div class="card mt-20">
        <h2>Activity Log</h2>
        <div id="activityLog" class="log">Waiting for activity...</div>
      </div>
    </div>
  </div>
</div>

<script>
const socket = io();
let selectedSessionId = null;
const api = (path, opts) => fetch('/api' + path, { headers: { 'Content-Type': 'application/json' }, ...opts });

socket.on('sessions', (sessions) => renderSessions(sessions));
socket.on('qr', (data) => { if (data.sessionId === selectedSessionId) showQr(data.qr); });
socket.on('ready', (data) => { if (data.sessionId === selectedSessionId) { hideQr(); log('ready', 'Session connected: ' + data.phone); } });
socket.on('auth_failure', (data) => { if (data.sessionId === selectedSessionId) { log('error', 'Auth failure: ' + data.msg); } });
socket.on('disconnected', (data) => { if (data.sessionId === selectedSessionId) { hideQr(); log('error', 'Disconnected: ' + data.reason); } });
socket.on('message_result', (data) => {
  const cls = data.status === 'sent' ? 'sent' : data.status === 'no_whatsapp' ? 'no_whatsapp' : 'error';
  log(cls, `[${data.number}] ${data.name || '?'} → ${data.status} (${data.remaining} remaining)`);
});
socket.on('queue_empty', () => log('sent', 'Queue completed'));
socket.on('incoming_message', (data) => log('no_whatsapp', '← From ' + data.from + ': ' + data.body));

async function createSession() {
  const name = document.getElementById('sessionName').value.trim();
  if (!name) return alert('Enter a session name');
  const res = await api('/sessions', { method: 'POST', body: JSON.stringify({ name }) });
  const data = await res.json();
  if (data.id) {
    document.getElementById('sessionName').value = '';
    selectSession(data.id);
    log('ready', 'Session created: ' + name);
  }
}

function renderSessions(sessions) {
  const el = document.getElementById('sessionList');
  const sel = document.getElementById('sendSessionSelect');
  el.innerHTML = '';
  sel.innerHTML = '<option value="">Select a session...</option>';
  sessions.forEach(s => {
    const dot = document.createElement('span');
    dot.className = 'status-dot status-' + s.status;
    const card = document.createElement('div');
    card.className = 'session-card' + (s.id === selectedSessionId ? ' selected' : '');
    card.innerHTML = `<div class="status">${dot.outerHTML} <strong>${s.name}</strong> <span style="color:#94a3b8;font-size:12px">${s.phone || ''}</span></div>
      <div class="flex">
        <span style="font-size:12px;color:${s.status === 'connected' ? '#22c55e' : '#94a3b8'}">${s.status}</span>
        <button class="btn-sm btn-secondary" onclick="selectSession('${s.id}')">Select</button>
        <button class="btn-sm btn-danger" onclick="deleteSession('${s.id}')">Del</button>
      </div>`;
    el.appendChild(card);
    const opt = document.createElement('option');
    opt.value = s.id;
    opt.textContent = s.name + ' (' + s.status + ')';
    sel.appendChild(opt);
  });
}

function selectSession(id) {
  selectedSessionId = id;
  document.getElementById('sendSessionSelect').value = id;
  document.getElementById('importSessionSelect').value = id;
  socket.emit('join_session', id);
  fetchContacts();
  log('ready', 'Selected session: ' + id);
}

async function deleteSession(id) {
  if (!confirm('Delete session?')) return;
  await api('/sessions/' + id, { method: 'DELETE' });
  if (selectedSessionId === id) selectedSessionId = null;
}

function showQr(qrData) {
  document.getElementById('qrCard').classList.remove('hidden');
  const container = document.getElementById('qrContainer');
  container.innerHTML = '';
  QRCode.toCanvas(container, qrData, { width: 200 }, (err) => {
    if (err) container.innerHTML = '<p style="color:#ef4444">Error generating QR</p>';
  });
  document.getElementById('qrStatus').textContent = 'Scan QR with WhatsApp';
}

function hideQr() {
  document.getElementById('qrContainer').innerHTML = '';
  document.getElementById('qrStatus').textContent = '';
}

async function sendSingle() {
  const sessionId = document.getElementById('sendSessionSelect').value;
  const number = document.getElementById('sendNumber').value.trim();
  const name = document.getElementById('sendName').value.trim();
  const message = document.getElementById('sendMessage').value.trim();
  if (!sessionId || !number) return alert('Select session and enter number');
  const res = await api('/sessions/' + sessionId + '/send', { method: 'POST', body: JSON.stringify({ number, name, message }) });
  const data = await res.json();
  log(data.status === 'sent' ? 'sent' : 'error', `[${number}] ${name || '?'} → ${data.status}`);
}

async function sendBulk() {
  const sessionId = document.getElementById('sendSessionSelect').value;
  const message = document.getElementById('sendMessage').value.trim();
  if (!sessionId) return alert('Select a session');
  log('ready', 'Starting bulk send...');
  const res = await api('/sessions/' + sessionId + '/send/bulk', { method: 'POST', body: JSON.stringify({ message }) });
  const data = await res.json();
  if (data.stats) log('sent', `Done: ${data.stats.sent} sent, ${data.stats.noWhatsApp} no WA, ${data.stats.errors} errors`);
}

async function importContacts() {
  const sessionId = document.getElementById('importSessionSelect').value.trim();
  const csv = document.getElementById('contactsCsv').value.trim();
  if (!sessionId || !csv) return alert('Enter session ID and CSV data');
  const lines = csv.split('\n').filter(l => l.trim());
  const contacts = lines.map(l => {
    const parts = l.split('|').map(s => s.trim());
    return { number: parts[0], name: parts[1] || '', address: parts[2] || '' };
  });
  const res = await api('/sessions/' + sessionId + '/contacts/bulk', { method: 'POST', body: JSON.stringify({ contacts }) });
  const data = await res.json();
  log('ready', `Imported ${data.count} contacts`);
  document.getElementById('contactsCsv').value = '';
  fetchContacts();
}

async function fetchContacts() {
  const sessionId = document.getElementById('importSessionSelect').value.trim();
  if (!sessionId) return;
  const res = await api('/sessions/' + sessionId + '/contacts');
  const contacts = await res.json();
  const el = document.getElementById('contactsList');
  if (contacts.length === 0) { el.innerHTML = '<p style="color:#94a3b8;font-size:13px">No contacts</p>'; return; }
  let html = '<table><tr><th>Number</th><th>Name</th></tr>';
  contacts.slice(0, 20).forEach(c => { html += `<tr><td>${c.number}</td><td>${c.name}</td></tr>`; });
  if (contacts.length > 20) html += `<tr><td colspan="2" style="color:#94a3b8">...and ${contacts.length - 20} more</td></tr>`;
  html += '</table>';
  el.innerHTML = html;
}

function log(cls, msg) {
  const el = document.getElementById('activityLog');
  const d = new Date().toLocaleTimeString();
  el.innerHTML += `<div class="${cls}">[${d}] ${msg}</div>`;
  el.scrollTop = el.scrollHeight;
}
</script>
</body>
</html>
